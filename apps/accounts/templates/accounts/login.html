{% load i18n static %}<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}{% get_current_language_bidi as LANGUAGE_BIDI %}
<html lang="{{ LANGUAGE_CODE|default:"hu" }}" dir="{{ LANGUAGE_BIDI|yesno:'rtl,ltr' }}">
<head>
    <title>{% block title %}managr{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="NONE,NOARCHIVE">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'MenedzserApp/css/style.css' %}">
    
    <!-- Extra styles -->
    {% block extrastyle %}{% endblock %}
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Extra head content -->
    {% block extrahead %}{% endblock %}
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="text-center">{{ title }}</h1>
            <p class="text-center">{{ welcome_message }}</p>
            <form method="post" action="{% url 'employee_login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_user_email" class="form-label">Email</label>
                    <input type="email" name="user_email" id="id_user_email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
